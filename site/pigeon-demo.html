<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pigeon — Flightplan</title>
<script>
  /* the theme the rest of the site is on, read before paint */
  try { if (localStorage.getItem('flightplan.brand') === 'nyu') document.documentElement.dataset.brand = 'nyu'; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@400;500;600;700&family=Patrick+Hand&family=Playfair+Display:wght@500;600;700&family=Playpen+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=8648adda">
<style>
  /* Demo-only page: one bird and its bubble, nothing else. The markup below is
     the same `.mascot` + `#pigeon-stage` pair every other page carries, so
     js/pigeon.js builds the real speech bubble here — reminders, outreach
     button, cheer line and all. Only the box's placement is overridden: it
     stands in the middle of the page instead of the bottom-right corner. */
  .pgd { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

  .pgd__head { padding: 22px 26px 0; }
  .pgd__eyebrow { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; color: var(--ink-3); }
  .pgd__title { font-family: var(--font-hand); font-weight: 400; font-size: 34px; line-height: 1.05; color: var(--ink); margin-top: 6px; }

  /* The bird stands on the floor's bottom edge, so the bubble has the whole
     space above it to open into rather than running off the top. */
  .pgd__floor { flex: 1 1 auto; display: grid; place-items: end center; padding: 12px 20px 0; }

  /* The mascot box, taken out of the corner and stood in the middle. The
     margin keeps the bubble's width to the bird's left on the page rather than
     off the edge of it, so the pair reads as one centred group. */
  .page-pigeon-demo .mascot {
    position: relative;
    right: auto; bottom: auto;
    margin-left: clamp(120px, 26vw, 320px);
    width: clamp(200px, min(44vh, 38vw), 460px);
    pointer-events: auto;
    z-index: 1;
  }
  .page-pigeon-demo .pg-bubble { max-width: min(300px, 40vw); }
  .page-pigeon-demo .mascot #pigeon-stage { width: 100%; }

  /* controls */
  .pgd__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 18px 20px 26px; }
  .pgd-tab {
    padding: 7px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel);
    font-size: 13px; color: var(--ink-2);
  }
  .pgd-tab:hover { border-color: var(--accent-line); color: var(--ink); }
  .pgd-tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pgd__now { width: 100%; text-align: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
  .pgd__hint { width: 100%; text-align: center; font-size: 12px; color: var(--ink-3); margin-top: 6px; }

  @media (max-width: 700px) {
    .pgd__head { padding: 16px 16px 0; }
    .pgd__title { font-size: 26px; }
    .page-pigeon-demo .mascot { width: min(46vw, 36vh); }
    /* the bubble grows upward from the beak, so on a phone its type comes down
       a notch to keep the whole thing on the screen */
    .page-pigeon-demo .pg-bubble { max-width: min(280px, 46vw); padding: 12px 16px 12px 12px; }
    .page-pigeon-demo .pg-bubble__head { font-size: 15px; }
    .page-pigeon-demo .pg-bubble__msg { font-size: 12px; margin-top: 3px; }
    .page-pigeon-demo .pg-item { gap: 6px; margin-top: 6px; }
    .page-pigeon-demo .pg-item__text { font-size: 12px; }
    .page-pigeon-demo .pg-item__chip { font-size: 6.5px; padding: 2px 5px; }
    .page-pigeon-demo .pg-bubble__act { font-size: 9px; padding: 5px 10px; margin-top: 8px; }
    .page-pigeon-demo .pg-bubble__cheer { font-size: 11.5px; margin-top: 8px; padding-top: 6px; }
    .page-pigeon-demo .pg-bubble__tuck { font-size: 11.5px; margin-top: 8px; }
    .pgd__bar { padding: 12px 16px 18px; }
  }
</style>
</head>
<body class="page-pigeon-demo">

<div class="pgd">
  <header class="pgd__head">
    <p class="pgd__eyebrow">FLIGHTPLAN · MASCOT</p>
    <h1 class="pgd__title">The pigeon</h1>
  </header>

  <div class="pgd__floor">
    <!-- Same pair as every page: js/pigeon.js finds #pigeon-stage, builds the
         speech bubble into this box and animates the 11 × 11 sprite sheet. -->
    <div class="mascot">
      <div id="pigeon-stage" role="img" aria-label="The Flightplan pigeon"></div>
    </div>
  </div>

  <div class="pgd__bar">
    <p class="pgd__now" id="pgDemoNow">Idle</p>
    <div id="pgDemoTabs" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"></div>
    <button class="pgd-tab" type="button" id="pgDemoPlay" aria-pressed="true">Pause</button>
    <button class="pgd-tab" type="button" id="pgDemoNext">Next →</button>
    <p class="pgd__hint">The bubble is the real one: click the bird to close or open it, or drag the bird about.</p>
  </div>
</div>

<script type="module" src="js/pigeon-demo.js"></script>

</body>
</html>
