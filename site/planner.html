<body class="page-planner">

<div class="app">

  <!-- Canonical sidebar — identical on every page (Figma Home frame 388:1275) -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <img class="sidebar__mark" src="assets/b/brand-rock.webp" alt="" width="40" height="37">
      <p class="sidebar__title">Flightplan</p>
      <p class="sidebar__tagline">DEGREE&nbsp;+&nbsp;CAREER</p>
    </div>
    <nav class="sidebar__nav">
      <a class="sidebar__link" href="index.html">Home</a>
      <a class="sidebar__link is-active" href="planner.html" aria-current="page">Planner</a>
      <a class="sidebar__link" href="plan.html">Goals</a>
      <a class="sidebar__link" href="career.html">Career</a>
      <a class="sidebar__link" href="visa.html">Visa</a>
    </nav>
    <!-- THIS TERM (build B §3.4). Seeded values match Home and Profile;
         js/sidebar.js repaints them from the store on load. -->
    <div class="sidebar__term">
      <p class="term__label">THIS TERM</p>
      <p class="term__line"><span data-term-label>Fall 2026</span> · <span data-term-inprog>18</span> <span data-term-unit>credits</span> in progress</p>
      <p class="term__pct"><span class="term__pct-num" data-term-pct>35%</span><span class="term__pct-cap">of the degree</span></p>
      <div class="term__bar">
        <div class="term__bar-done" data-term-bar-done style="width:35%"></div>
        <div class="term__bar-prog" data-term-bar-prog style="width:13%"></div>
      </div>
    </div>
    <div class="sidebar__foot">
      <a class="sidebar__avatar avatar" href="profile.html" aria-label="Your profile">
        <span class="avatar__initials" data-avatar-initials aria-hidden="true">JL</span>
      </a>
    </div>
  </aside>

  <main class="main">

    <!-- Two presentations of one plan, both drawn by the hosted app itself
         (build B §4). The control is local to this page: it is not a nav item,
         it is not in the sidebar, and no other screen has it. -->
    <div class="planner-bar">
      <h1 class="planner-bar__title">Planner</h1>
      <div class="planner-toggle" id="plannerView" role="group" aria-label="Planner view">
        <button type="button" data-screen="board">Board view</button>
        <button type="button" data-screen="timeline">Semester view</button>
      </div>
    </div>

    <div class="planner-stage">
      <!-- The Compass Planner app — same panels, same semester blocks. Built from
           the untouched root bundle by tools/build-planner-new.py, which is where
           every change to it lives: the board draws no connecting arrows until a
           course is selected and packs each block's courses on one grid; the search
           bar is a real input with ⌘K bound to it; the plan is Carnegie Mellon's,
           nine terms to Spring 2029, agreeing with Home on the term in progress;
           and what you select, apply and insert survives a reload. -->
      <iframe class="planner-frame" id="plannerApp" src="planner-new-app.html" title="Planner"></iframe>
    </div>

    <!-- Neither pill is marked in the markup, so the wrong one is never painted
         while the stored choice is read. With scripting off that read never
         happens and the app boots on its own default, the board — so say so. -->
    <noscript><style>
      #plannerView button[data-screen="board"] {
        border-color: #A2593A; background: #F0D9C8; color: #7E3F22;
      }
    </style></noscript>

  </main>
</div>

<script type="module" src="js/sidebar.js"></script>
<!-- The prototype gate + quiz live in app.js and must run on every page. -->
<script type="module" src="js/app.js"></script>
<script type="module">
import { store } from './js/store.js';

/* ---------------------------------------------------------------- view toggle
   Board view / Semester view are the app's own `board` and `timeline` screens —
   the two the hidden nav rail used to reach. The pills do not draw anything
   themselves; they move the app between the screens it already has, and the app
   tells them back which one it is drawing (it can move itself: "See alternatives
   →" on the semester plan goes to the board).

   Which one is showing is remembered across visits in the shared
   `stellic-pathfinders` blob, under `fields.plannerScreen`. Scoped to this page:
   no other screen reads it. */

const VIEW_FIELD = 'plannerScreen';
const frame = document.getElementById('plannerApp');
const toggle = document.getElementById('plannerView');
const buttons = [...toggle.querySelectorAll('button')];

const isView = (s) => s === 'board' || s === 'timeline';

/* Paint only. The app has three more screens behind its ⌘K search and its term
   overlay ('advising', 'map', 'dashboard'); on those, neither pill is marked,
   which is the truth — the plan is not on screen at all. */
function paint(screen) {
  for (const b of buttons) {
    const on = b.dataset.screen === screen;
    b.classList.toggle('is-on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  document.body.dataset.plannerView = screen;
}

/* The board is the default for a first visit; a stored choice wins. */
let view = store.get('fields', VIEW_FIELD, 'board');
if (!isView(view)) view = 'board';
paint(view);

/* `screen = this.state.screen ?? props.defaultView`, so the prop only decides the
   *first* screen — after that the state holds it. The bundle copy therefore
   publishes `__plannerScreenBridge` (see tools/build-planner-new.py, "screen
   bridge"), which is the same `setState({ screen })` the rail called. Before the
   app has booted there is no bridge and no state either, so the prop is exactly
   right; that is the path the initial `defaultView` below takes. */
function go(screen) {
  const win = frame.contentWindow;
  try {
    if (win && win.__plannerScreenBridge) { win.__plannerScreenBridge.set(screen); return true; }
    const name = win && win.__dcRegistry && Object.keys(win.__dcRegistry)[0];
    if (name && typeof win.__dcSetProps === 'function') {
      win.__dcSetProps(name, { defaultView: screen });
      return true;
    }
  } catch (e) { /* not booted yet — the boot below passes the same screen as a prop */ }
  return false;
}

toggle.addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-screen]');
  if (!b) return;
  view = b.dataset.screen;
  store.set('fields', VIEW_FIELD, view);
  paint(view);
  go(view);
});


/* ------------------------------------------------------------ app corrections
   The hosted bundle is a stand-alone app: it ships its own left rail (nav +
   school picker + progress) and it opens with one course already selected on the
   board. Both are wrong here — the site already has a sidebar, and the planner
   should start as a clean slate. The bundle is not string-edited for this; the
   iframe is same-origin, so it is corrected from this side after it loads.

   Only timers are used below — never requestAnimationFrame, which does not fire
   in a background tab and would leave the planner blank until the failsafe. */

/* The app's root is `#dc-root > .sc-host > <flex row>`, whose first child is the
   198px sticky rail. Matched structurally and by that width so a stray first
   child could not be hidden by accident. Both spellings, because the serialised
   attribute is unspaced but the DOM normalises it with a space. */
const HIDE_INNER_NAV =
  '#dc-root .sc-host > div > div:first-child[style*="width:198px"],' +
  '#dc-root .sc-host > div > div:first-child[style*="width: 198px"]' +
  '{display:none !important}';

/* A selected course pill is the only thing drawn with a 2px #A2593A border, so
   this is a direct read of "how many courses are selected". */
function selectedCount(doc) {
  let n = 0;
  const pills = doc.querySelectorAll('#dc-root button');
  for (const pill of pills) {
    const s = doc.defaultView.getComputedStyle(pill);
    if (s.borderTopWidth === '2px' && s.borderTopColor === 'rgb(162, 89, 58)') n++;
  }
  return n;
}

function correct() {
  /* Hide the view until the corrections are applied, so the app's own rail and
     its seeded selection are never painted. */
  frame.classList.add('is-booting');
  let revealed = false;
  const reveal = () => { if (!revealed) { revealed = true; frame.classList.remove('is-booting'); } };
  /* Safety net: never leave the planner hidden if anything below fails. */
  setTimeout(reveal, 5000);

  let applied = false;
  const deadline = Date.now() + 5000;

  function step() {
    let doc, win;
    try { doc = frame.contentDocument; win = frame.contentWindow; } catch (e) { return reveal(); }
    if (!doc || !win) return reveal();

    /* This polls every 16ms across the whole of a 1.4MB document load, so it will
       land inside the instant where the browser has swapped in the new Document
       but has not parsed an element into it yet: `head` and `documentElement` are
       both null there. Nothing to do that tick — come back next one. */
    const mount = doc.head || doc.documentElement;
    if (!mount) {
      if (Date.now() > deadline) return reveal();
      return setTimeout(step, 16);
    }

    /* 1 — suppress the app's internal nav rail. A stylesheet, so it also covers
       anything the app renders later. */
    if (!doc.getElementById('site-planner-overrides')) {
      const style = doc.createElement('style');
      style.id = 'site-planner-overrides';
      style.textContent = HIDE_INNER_NAV;
      mount.appendChild(style);
    }

    /* 2 — listen for the screen the app is about to draw, so the pills follow it
       wherever it goes, including the moves it makes on its own. Installed before
       the app boots, so the very first render already reports. */
    if (!win.__plannerOnScreen) {
      win.__plannerOnScreen = (screen) => {
        /* Everything the app draws before step 3 has run is its own default, not
           the stored choice — reporting that would overwrite the very value being
           restored. Nothing to hear until the app has been told where to start. */
        if (!applied || screen === document.body.dataset.plannerView) return;
        paint(screen);
        if (isView(screen)) { view = screen; store.set('fields', VIEW_FIELD, screen); }
      };
    }

    /* 3 — start with no course selected, on the stored screen. The bundle exposes
       both as props: `panelState` 'course' (its default) seeds the board with
       CS 210 selected and 'overview' starts with nothing selected and the overview
       panel open; `defaultView` picks the screen for the first render, before any
       screen state exists. Every course stays in the catalogue and stays clickable.
       The bundle decompresses its assets before booting, so poll until the runtime
       is there rather than assuming it exists at the iframe's load event. */
    if (!applied) {
      try {
        const name = win.__dcRegistry && Object.keys(win.__dcRegistry)[0];
        if (name && typeof win.__dcSetProps === 'function') {
          win.__dcSetProps(name, { panelState: 'overview', defaultView: view });
          applied = true;
        }
      } catch (e) { /* app is still usable without it */ }
    }

    /* Reveal once the board has actually rendered with nothing selected — the prop
       change re-renders asynchronously, so wait for the result, not a fixed delay.

       Unless the app restored a selection of its own. The planner now remembers the
       course you had open (tools/build-planner-new.py, "planner persistence"), and
       a restored selection is the *right* thing to paint, not the seeded one this
       wait exists to hide — so the app sets `__plannerRestoredSel` when, and only
       when, it brings one back, and that is the case where a painted selection means
       the corrections have landed rather than that they have not. Without it the
       count could never reach zero and the planner would sit hidden for the whole
       five-second failsafe. */
    const root = doc.getElementById('dc-root');
    const booted = !!(root && root.textContent.length > 200);
    const restored = (() => { try { return !!win.__plannerRestoredSel; } catch (e) { return false; } })();
    if (applied && booted && (restored || selectedCount(doc) === 0)) return reveal();

    if (Date.now() > deadline) return reveal();
    setTimeout(step, 16);
  }

  step();
}

correct();
</script>

</body>
</html>
